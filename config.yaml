# model相关配置
# 模型密钥仍从本地 .env 中的 api_key_env 变量读取（当前使用 Qwen）。
# 主模型、记忆辅助模型与压缩模型共用的名称。
model: qwen3.7-flash
# OpenAI 兼容服务地址，null 表示使用 SDK 默认值。
base_url: https://maas.qianwenaiapi.com/compatible-mode/v1
# 模型密钥的环境变量名；密钥值保留在本地 .env。
api_key_env: DASHSCOPE_API_KEY
# 由模型服务端执行的工具类型；网页抓取 web_extractor 需与联网搜索 web_search 同时启用。
model_hosted_tools:
- web_search
- web_extractor

# 是否提供长期记忆目录和工具，并启用轮前召回与轮末提取。
long_term_memory_enabled: true

# 上下文压缩相关配置（所有模型共用的策略参数）
# 有效上下文窗口占模型原始窗口的百分比（1~100）。
effective_window_percent: 95
# 自动触发上下文压缩的百分比阈值（1~100，且不大于 effective_window_percent）。
auto_compact_percent: 90
# 压缩重建历史时，最多保留的用户原话 token 预算上限。
compact_keep_user_tokens: 20000


# 工具权限相关配置
# 单个工具文本输出块的 token 上限，超出时首尾截断并将完整内容转存到 /.task_outputs。
tool_output_max_tokens: 10000
# PowerShell 单次执行的最长秒数。
powershell_timeout: 120
# 允许目录及其子目录，相对路径以本配置文件所在目录为基准。
allowed_dirs:
- .
- D:/projects

# AgentRuntime 同时处理请求的最大数量。
max_concurrent_requests: 10
# 会话执行结束后，原来源继续占用的秒数；0 表示结束后立即允许其他来源接管。
session_owner_ttl: 60

# 通道channel相关配置
# id 标识每个实例，type 表示tunnel类型，enabled 控制启动。
channels:
- id: terminal_main
  type: terminal
  enabled: true
  options:
    host: 127.0.0.1
    port: 8765
- id: qq_bot1
  type: qq
  enabled: true
  options:
    app_id_env: QQ_APP_ID
    secret_env: QQ_APP_SECRET
    is_sandbox: false
    
# MCP 服务器定义；支持 stdio 与 Streamable HTTP。
mcp_servers:
  interview_post_crawl:
    type: http
    url: http://localhost:8000/mcp

# 输入队列容量；第一版由一个消费者顺序处理。
queue_size: 100

# 通道实例列表；id 用于回复分发，type 用于选择通道实现。
channels:
  - id: terminal_main
    type: terminal
    enabled: true
    options:
      # 仅监听本机，终端客户端默认连接此地址。
      host: 127.0.0.1
      port: 8765
  - id: qq_main
    type: qq
    # QQ 好友私聊；凭据从本地 .env 读取，不写入通道配置。
    enabled: true
    options:
      app_id_env: QQ_APP_ID
      secret_env: QQ_APP_SECRET
      # 好友私聊默认使用正式 API，测试成员在 QQ 平台后台配置。
      is_sandbox: false

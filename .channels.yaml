# 输入队列容量；第一版由一个消费者顺序处理。
queue_size: 100

# 通道实例列表；id 用于回复分发，type 用于选择通道实现。
channels:
  - id: terminal_main
    type: terminal
    enabled: true
    options:
      # 仅监听本机，终端客户端默认连接此地址。
      host: 127.0.0.1
      port: 8765
  - id: qq_main
    type: qq
    # QQ 目前为占位类，后续实现协议后再启用。
    enabled: false
